services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projet_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - huggingface_cache:/root/.cache/huggingface
    env_file:
      - ./backend/.env
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: projet_frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  huggingface_cache:
