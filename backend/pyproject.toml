[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
##
# Après avoir ajouter des dépendances, pour regénérer `requirements.txt` :
#
#   uv pip compile pyproject.toml -o requirements.txt --generate-hashes --extra-index-url https://download.pytorch.org/whl/cpu
dependencies = [
    "beautifulsoup4>=4.14.3",
    "databases>=0.9.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.129.0",
    "python-multipart>=0.0.22",
    "requests>=2.28.1",
    "sqlalchemy>=2.0.46",
    "chromadb",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.0.0",
    "pydantic>=2.0.0",
    "feedparser",
    "newspaper3k",
    "pandas"
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "requests>=2.32.5",
]
